<div id="nt">
  <div id="desk">
    <div id="icons"></div>
  </div>
  <div id="wins"></div>

  <nav id="taskbar">
    <button id="startBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="start"></button>
    <div id="tasks"></div>
    <div id="tray">
      <button id="dunTray" type="button" hidden></button>
      <button id="langBtn" type="button" aria-haspopup="menu"></button>
      <span id="clock"></span>
    </div>
  </nav>

  <div id="start" class="menu" role="menu" hidden></div>
  <div id="fly" class="menu" role="menu" hidden></div>

  <div id="logon" hidden></div>
  <div id="boot" hidden aria-hidden="true">
    <pre id="bootTxt"></pre>
    <div id="bootSkip"></div>
  </div>
</div>
