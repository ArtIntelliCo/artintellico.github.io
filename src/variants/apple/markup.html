<div class="case">
  <div class="tube">
    <canvas id="scr" width="320" height="192" aria-hidden="true"></canvas>
    <input id="kbd" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="BASIC">
  </div>
  <span class="badge" aria-hidden="true">ARTINTELLICO ][</span>
</div>
<div class="keys" id="keys">
  <button type="button" data-key="Escape">ESC</button>
  <button type="button" data-key="ArrowLeft" aria-label="Left">&larr;</button>
  <button type="button" data-key="ArrowRight" aria-label="Right">&rarr;</button>
  <button type="button" data-key="Enter">RETURN</button>
</div>
<div class="sr" id="sr" role="status" aria-live="polite"></div>
